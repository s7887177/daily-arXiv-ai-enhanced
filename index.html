<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv 科普日報</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<style>
  :root{ --bg:#000; --ink:#ededed; --dim:#9a9a9a; --line:#2b2b2b; --card:#0c0c0c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:"Noto Serif TC","Songti TC",Georgia,serif;line-height:1.75;
    -webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
  header.site{border-bottom:1px solid var(--line);padding:34px 0 22px;margin-bottom:34px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  header.site h1{font-size:30px;font-weight:700;letter-spacing:.5px}
  header.site .sub{color:var(--dim);margin-top:8px;font-size:15px}
  .datebtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);color:var(--ink);font-family:system-ui,sans-serif;
    font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer}
  .datebtn:hover{border-color:#7a7a7a}
  .datebtn svg{width:15px;height:15px}
  #dp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  .grid{display:grid;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));padding-bottom:90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:22px;cursor:pointer;display:flex;flex-direction:column;
    transition:border-color .15s ease, transform .15s ease}
  .card:hover{border-color:#5a5a5a;transform:translateY(-3px)}
  .card .kicker{font-family:system-ui,sans-serif;font-size:12px;color:var(--dim);
    letter-spacing:.5px;margin-bottom:12px}
  .card h2{font-size:21px;line-height:1.45;font-weight:700;margin-bottom:11px}
  .card .hook{color:var(--dim);font-size:15px;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .card .src{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font-family:system-ui,sans-serif;font-size:12.5px;color:var(--dim)}

  .overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:40}
  .overlay.open{display:block}
  .overlay .wrap{max-width:660px}
  .topbar{position:sticky;top:0;background:var(--bg);padding:12px 0;
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;font-family:system-ui,sans-serif;font-size:13px}
  .topbar a,.topbar button{color:var(--dim);background:none;border:none;
    font:inherit;cursor:pointer;text-decoration:none}
  .topbar a:hover,.topbar button:hover{color:var(--ink)}
  .topbar .links a{margin-left:18px}

  .body{font-size:18px;margin-top:26px}
  .body h1{font-size:30px;line-height:1.35;font-weight:700;margin:6px 0 26px}
  .body h2{font-size:21px;font-weight:700;margin:34px 0 12px;
    padding-top:18px;border-top:1px solid var(--line)}
  .body h3{font-size:18px;font-weight:700;margin:22px 0 8px}
  .body p{margin:15px 0}
  .body strong{font-weight:700;color:#fff}
  .body em{font-style:normal}
  .body ul,.body ol{margin:12px 0 12px 24px}
  .body li{margin:7px 0}
  .body blockquote{border-left:2px solid var(--line);padding-left:16px;
    color:var(--dim);margin:16px 0}
  .body hr{border:none;border-top:1px solid var(--line);margin:28px 0}
  .body img{max-width:100%;height:auto;display:block;margin:20px auto;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px}
  .body table{border-collapse:collapse;width:100%;margin:18px 0;
    font-family:system-ui,sans-serif;font-size:14px}
  .body th,.body td{border:1px solid var(--line);padding:9px 11px;
    text-align:left;vertical-align:top}
  .body th{color:#fff}

  .nav{position:fixed;top:50%;transform:translateY(-50%);z-index:50;
    width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:var(--card);border:1px solid var(--line);
    color:var(--ink);cursor:pointer;user-select:none;transition:border-color .15s}
  .nav:hover{border-color:#7a7a7a}
  .nav svg{width:18px;height:18px;display:block}
  .nav.prev{left:max(14px,calc(50% - 400px))}
  .nav.next{right:max(14px,calc(50% - 400px))}
  .nav[hidden]{display:none}

  .empty{color:var(--dim);padding:70px 0;text-align:center;font-family:system-ui,sans-serif}
  @media(max-width:900px){ .nav.prev{left:6px} .nav.next{right:6px} }
</style>
</head>
<body>

<div id="home">
  <div class="wrap">
    <header class="site">
      <div>
        <h1>arXiv 科普日報</h1>
        <div class="sub">把每天的 arXiv 論文寫成給一般人看的說明文章。<span id="count"></span></div>
      </div>
      <div>
        <button class="datebtn" id="dateBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
          <span id="curDateLabel">—</span>
        </button>
        <input id="dp" type="text">
      </div>
    </header>
    <div class="grid" id="grid"><div class="empty">載入中…</div></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="wrap">
    <div class="topbar">
      <button id="back">← 回列表</button>
      <span class="links" id="links"></span>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="nav prev" id="prev" hidden title="較新 / 上一篇" aria-label="上一篇">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
</div>
<div class="nav next" id="next" hidden title="較舊 / 下一篇" aria-label="下一篇">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</div>

<script>
const INDEX_URL = "./data/articles/index.json";
const DAY_URL  = d => `./data/articles/${d}.json`;
let DATES = [], curDate = null, ARTICLES = [], cur = -1, fp = null;
const $ = id => document.getElementById(id);

function showList(){
  $("overlay").classList.remove("open");
  $("prev").hidden = true; $("next").hidden = true;
  document.title = "arXiv 科普日報";
  window.scrollTo(0,0);
}

async function showArticle(i, push){
  const a = ARTICLES[i]; if(!a) return;
  cur = i;
  if (push) location.hash = `${curDate}/${a.arxiv_id}`;
  $("links").innerHTML =
    `<a href="${a.url}" target="_blank" rel="noopener">arXiv 摘要</a>` +
    `<a href="${a.pdf}" target="_blank" rel="noopener">PDF</a>`;
  $("body").innerHTML = "<p style='color:#9a9a9a'>載入文章中…</p>";
  $("overlay").classList.add("open");
  window.scrollTo(0,0); $("overlay").scrollTop = 0;
  try{
    const r = await fetch(a.md); if(!r.ok) throw new Error("HTTP "+r.status);
    $("body").innerHTML = marked.parse(await r.text());
  }catch(e){ $("body").innerHTML = `<p>文章載入失敗：${e.message}</p>`; }
  document.title = a.headline + " — arXiv 科普日報";
  $("prev").hidden = i <= 0;
  $("next").hidden = i >= ARTICLES.length - 1;
}

function cardHTML(a,i){
  return `<article class="card" data-i="${i}">
    <div class="kicker">${a.category_label}</div>
    <h2>${a.headline}</h2>
    <div class="hook">${a.hook}</div>
    <div class="src">${a.affiliations} ・ arXiv ${a.arxiv_id}</div>
  </article>`;
}

async function loadDay(date){
  const r = await fetch(DAY_URL(date));
  if(!r.ok) throw new Error("HTTP "+r.status+" "+date);
  const d = await r.json();
  curDate = date;
  ARTICLES = d.articles || [];
  $("curDateLabel").textContent = date;
  $("count").textContent = `（${date}・${ARTICLES.length} 篇）`;
  $("grid").innerHTML = ARTICLES.map(cardHTML).join("") ||
    `<div class="empty">這天沒有文章</div>`;
  $("grid").querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click", ()=> showArticle(+el.dataset.i, true));
  });
  if (fp) fp.setDate(date, false);
}

// hash: #<date>/<arxiv_id>  |  #<date>  |  #<arxiv_id>(舊) | 空
async function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/,""));
  let date = null, aid = null;
  if (h.includes("/")) { [date, aid] = h.split("/"); }
  else if (/^\d{4}-\d{2}-\d{2}$/.test(h)) { date = h; }
  else if (h) { aid = h; }                       // bare id -> latest day
  if (!date || !DATES.includes(date)) date = DATES[0];
  if (!curDate || curDate !== date) {
    try { await loadDay(date); }
    catch(e){ $("grid").innerHTML = `<div class="empty">載入失敗：${e.message}</div>`; return; }
  }
  if (aid){
    const i = ARTICLES.findIndex(a => a.arxiv_id === aid || a.id === aid);
    if (i >= 0) { showArticle(i, false); return; }
  }
  showList();
}

$("back").addEventListener("click", ()=>{ location.hash = curDate || ""; });
$("prev").addEventListener("click", ()=> showArticle(cur-1, true));
$("next").addEventListener("click", ()=> showArticle(cur+1, true));
$("dateBtn").addEventListener("click", ()=> fp && fp.open());
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e=>{
  if(!$("overlay").classList.contains("open")) return;
  if(e.key==="Escape") location.hash = curDate || "";
  if(e.key==="ArrowLeft" && cur>0) showArticle(cur-1, true);
  if(e.key==="ArrowRight" && cur<ARTICLES.length-1) showArticle(cur+1, true);
});

fetch(INDEX_URL).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
.then(idx=>{
  DATES = (idx.dates || []).slice().sort().reverse();   // newest first
  if (!DATES.length){ $("grid").innerHTML = `<div class="empty">尚無任何日期</div>`; return; }
  fp = flatpickr("#dp", {
    enable: DATES, defaultDate: DATES[0], clickOpens: false,
    positionElement: $("dateBtn"),
    onChange: (sel, str)=>{ if(str && str!==curDate) location.hash = str; }
  });
  route();
}).catch(err=>{
  $("grid").innerHTML = `<div class="empty">載入失敗：${err.message}<br>
    請用本機伺服器開啟（python3 -m http.server），不要用 file:// 直接開。</div>`;
});
</script>
</body>
</html>

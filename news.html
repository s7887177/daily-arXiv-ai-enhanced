<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv 科普日報 — 預覽</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{ --bg:#000; --ink:#ededed; --dim:#9a9a9a; --line:#2b2b2b; --card:#0c0c0c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:"Noto Serif TC","Songti TC",Georgia,serif;line-height:1.75;
    -webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
  header.site{border-bottom:1px solid var(--line);padding:34px 0 22px;margin-bottom:34px}
  header.site h1{font-size:30px;font-weight:700;letter-spacing:.5px}
  header.site .sub{color:var(--dim);margin-top:8px;font-size:15px}

  .grid{display:grid;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));padding-bottom:90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:22px;cursor:pointer;display:flex;flex-direction:column;
    transition:border-color .15s ease, transform .15s ease}
  .card:hover{border-color:#5a5a5a;transform:translateY(-3px)}
  .card .kicker{font-family:system-ui,sans-serif;font-size:12px;color:var(--dim);
    letter-spacing:.5px;margin-bottom:12px}
  .card h2{font-size:21px;line-height:1.45;font-weight:700;margin-bottom:11px}
  .card .hook{color:var(--dim);font-size:15px;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .card .src{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font-family:system-ui,sans-serif;font-size:12.5px;color:var(--dim)}

  /* article view */
  .overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:40}
  .overlay.open{display:block}
  .article{max-width:740px;margin:0 auto;padding:24px 24px 140px}
  .topbar{position:sticky;top:0;background:var(--bg);padding:12px 0;
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;font-family:system-ui,sans-serif;font-size:13px}
  .topbar a,.topbar button{color:var(--dim);background:none;border:none;
    font:inherit;cursor:pointer;text-decoration:none}
  .topbar a:hover,.topbar button:hover{color:var(--ink)}
  .topbar .links a{margin-left:18px}

  .body{font-size:18px;margin-top:26px}
  .body h1{font-size:30px;line-height:1.35;font-weight:700;margin:6px 0 26px}
  .body h2{font-size:21px;font-weight:700;margin:34px 0 12px;
    padding-top:18px;border-top:1px solid var(--line)}
  .body h3{font-size:18px;font-weight:700;margin:22px 0 8px}
  .body p{margin:15px 0}
  .body strong{font-weight:700;color:#fff}
  .body em{font-style:normal}
  .body ul,.body ol{margin:12px 0 12px 24px}
  .body li{margin:7px 0}
  .body blockquote{border-left:2px solid var(--line);padding-left:16px;
    color:var(--dim);margin:16px 0}
  .body hr{border:none;border-top:1px solid var(--line);margin:28px 0}
  .body img{max-width:100%;height:auto;display:block;margin:20px auto;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px}
  .body table{border-collapse:collapse;width:100%;margin:18px 0;
    font-family:system-ui,sans-serif;font-size:14px}
  .body th,.body td{border:1px solid var(--line);padding:9px 11px;
    text-align:left;vertical-align:top}
  .body th{color:#fff}

  /* fixed prev / next — always visible while reading */
  .nav{position:fixed;top:50%;transform:translateY(-50%);z-index:50;
    width:46px;height:78px;display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);color:var(--ink);
    cursor:pointer;font-size:22px;font-family:system-ui,sans-serif;
    user-select:none}
  .nav:hover{border-color:#6a6a6a}
  .nav.prev{left:max(14px,calc(50% - 470px));border-radius:0 10px 10px 0}
  .nav.next{right:max(14px,calc(50% - 470px));border-radius:10px 0 0 10px}
  .nav[hidden]{display:none}
  .nav small{position:absolute;bottom:7px;font-size:10px;color:var(--dim)}

  .empty{color:var(--dim);padding:70px 0;text-align:center;
    font-family:system-ui,sans-serif}
  @media(max-width:900px){ .nav.prev{left:6px} .nav.next{right:6px} }
</style>
</head>
<body>

<div id="home">
  <div class="wrap">
    <header class="site">
      <h1>arXiv 科普日報</h1>
      <div class="sub">把當天的 AI 論文寫成給一般人看的說明文章。<span id="count"></span></div>
    </header>
    <div class="grid" id="grid"><div class="empty">載入中…</div></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="wrap">
    <div class="topbar">
      <button id="back">← 回列表</button>
      <span class="links" id="links"></span>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="nav prev" id="prev" hidden>‹<small>上一篇</small></div>
<div class="nav next" id="next" hidden>›<small>下一篇</small></div>

<script>
const MANIFEST = "./data/articles/2026-05-19.json";
let ARTICLES = [], cur = -1;
const $ = id => document.getElementById(id);

function showList(){
  $("overlay").classList.remove("open");
  $("prev").hidden = true; $("next").hidden = true;
  if (location.hash) history.replaceState(null,"",location.pathname);
  document.title = "arXiv 科普日報 — 預覽";
  window.scrollTo(0,0);
}

async function showArticle(i, push){
  const a = ARTICLES[i]; if(!a) return;
  cur = i;
  if (push) location.hash = encodeURIComponent(a.id);
  $("links").innerHTML =
    `<a href="${a.url}" target="_blank" rel="noopener">arXiv 摘要</a>` +
    `<a href="${a.pdf}" target="_blank" rel="noopener">PDF</a>`;
  $("body").innerHTML = "<p style='color:#9a9a9a'>載入文章中…</p>";
  $("overlay").classList.add("open");
  window.scrollTo(0,0); $("overlay").scrollTop = 0;
  try{
    const r = await fetch(a.md); if(!r.ok) throw new Error("HTTP "+r.status);
    $("body").innerHTML = marked.parse(await r.text());
  }catch(e){ $("body").innerHTML = `<p>文章載入失敗：${e.message}</p>`; }
  document.title = a.headline + " — arXiv 科普日報";
  $("prev").hidden = i <= 0;
  $("next").hidden = i >= ARTICLES.length - 1;
}

function cardHTML(a,i){
  return `<article class="card" data-i="${i}">
    <div class="kicker">重要度 ${a.importance} ・ ${a.category_label}</div>
    <h2>${a.headline}</h2>
    <div class="hook">${a.hook}</div>
    <div class="src">${a.affiliations} ・ arXiv ${a.arxiv_id}</div>
  </article>`;
}

function routeFromHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/,""));
  const i = ARTICLES.findIndex(a => a.id === h);
  if (i >= 0) showArticle(i, false); else showList();
}

$("back").addEventListener("click", showList);
$("prev").addEventListener("click", ()=> showArticle(cur-1, true));
$("next").addEventListener("click", ()=> showArticle(cur+1, true));
window.addEventListener("hashchange", routeFromHash);
document.addEventListener("keydown", e=>{
  if(!$("overlay").classList.contains("open")) return;
  if(e.key==="Escape") showList();
  if(e.key==="ArrowLeft" && cur>0) showArticle(cur-1, true);
  if(e.key==="ArrowRight" && cur<ARTICLES.length-1) showArticle(cur+1, true);
});

fetch(MANIFEST).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
.then(d=>{
  ARTICLES = d.articles || [];
  $("count").textContent = `今日 ${ARTICLES.length} 篇（${d.date}）`;
  $("grid").innerHTML = ARTICLES.map(cardHTML).join("") ||
    `<div class="empty">今日沒有文章</div>`;
  $("grid").querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click", ()=> showArticle(+el.dataset.i, true));
  });
  routeFromHash();           // deep-link: open article if URL has #id
}).catch(err=>{
  $("grid").innerHTML = `<div class="empty">載入失敗：${err.message}<br>
    請用本機伺服器開啟（python3 -m http.server），不要用 file:// 直接開。</div>`;
});
</script>
</body>
</html>
